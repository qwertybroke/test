<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Утилиты: детерминированный ГПСЧ, шум, сплайны
   ===================================================================== */
let SEED = 20251109;
function rand() {
  SEED = (SEED + 0x6D2B79F5) | 0;
  let t = Math.imul(SEED ^ (SEED >>> 15), 1 | SEED);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const sq = (x) => x * x;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const angleDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const TAU = Math.PI * 2;

const PERM = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const hash3 = (x, y, z) => PERM[(PERM[(PERM[x & 255] + y) & 255] + z) & 255] / 255;
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v),
              lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v), w) * 2 - 1;
}
function fbm3(x, y, z, oct = 4) { let a = 0.5, f = 1, s = 0; for (let i = 0; i < oct; i++) { s += a * vnoise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; } return s; }

// Кубический сплайн Эрмита по опорным точкам [[u, value], ...]
function spline(pts) {
  const n = pts.length;
  return (u) => {
    if (u <= pts[0][0]) return pts[0][1];
    if (u >= pts[n - 1][0]) return pts[n - 1][1];
    let i = 0; while (u > pts[i + 1][0]) i++;
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n - 1)];
    const h = p2[0] - p1[0], t = (u - p1[0]) / h;
    const m1 = (p2[1] - p0[1]) / (p2[0] - p0[0]) * h, m2 = (p3[1] - p1[1]) / (p3[0] - p1[0]) * h;
    const t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2;
  };
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c, { srgb = true, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = 8;
  return t;
}

/* =====================================================================
   Размеры аквариума (1 ед. ≈ 8.5 см): 120 × 65 × 55 см
   ===================================================================== */
const TANK = { w: 14, h: 7.6, d: 6.4, glass: 0.12 };
const WATER_Y = 7.05;
const IN = {
  minX: -TANK.w / 2 + TANK.glass, maxX: TANK.w / 2 - TANK.glass,
  minZ: -TANK.d / 2 + TANK.glass, maxZ: TANK.d / 2 - TANK.glass,
  minY: TANK.glass, maxY: WATER_Y,
};

/* =====================================================================
   Рендерер, сцена, камера
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const BG_DAY = new THREE.Color(0x0b0e13), BG_NIGHT = new THREE.Color(0x030508);
scene.background = BG_DAY.clone();

const pmrem = new THREE.PMREMGenerator(renderer);
// Окружение для отражений: тёмная комната, полоса светильника сверху и пара тусклых источников
function makeEnvironment() {
  const env = new THREE.Scene();
  const room = new THREE.Mesh(new THREE.BoxGeometry(44, 24, 44), new THREE.MeshBasicMaterial({ color: 0x0c0e12, side: THREE.BackSide }));
  room.position.y = 6; env.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(44, 44), new THREE.MeshBasicMaterial({ color: 0x17130f }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -4.6; env.add(floor);
  const panel = (w, h, c, pos, look) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(...look); env.add(m);
  };
  panel(13, 1.4, new THREE.Color(7, 6.8, 6.2), [0, 9, 0], [0, 0, 0]);
  panel(5, 3.5, new THREE.Color(1.1, 0.8, 0.55), [-16, 9, 12], [0, 4, 0]);
  panel(9, 4, new THREE.Color(0.18, 0.22, 0.3), [14, 7, -12], [0, 4, 0]);
  panel(10, 3, new THREE.Color(0.22, 0.22, 0.26), [0, 6, 20], [0, 4, 0]);
  return pmrem.fromScene(env, 0.02).texture;
}
const envTex = makeEnvironment();

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 42;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.57;
controls.autoRotateSpeed = 0.45;
controls.enablePan = true;
controls.screenSpacePanning = true;

function fitDistance() {
  const vfov = THREE.MathUtils.degToRad(camera.fov);
  const byH = (TANK.h + 3.2) / (2 * Math.tan(vfov / 2));
  const byW = (TANK.w + 2.2) / (2 * Math.tan(vfov / 2) * camera.aspect);
  return Math.max(byH, byW, 15);
}
const camDir = new THREE.Vector3(0, 0.1, 1).normalize();
camera.position.copy(controls.target).addScaledVector(camDir, fitDistance() * 1.6);

/* =====================================================================
   Общие униформы подводного освещения
   ===================================================================== */
const U = {
  uTime: { value: 0 },
  uWaterColor: { value: new THREE.Color(0x0b5566) },
  uAbsorb: { value: new THREE.Vector3(0.12, 0.05, 0.04) },
  uScatter: { value: 0.075 },
  uBoxMin: { value: new THREE.Vector3(IN.minX, IN.minY, IN.minZ) },
  uBoxMax: { value: new THREE.Vector3(IN.maxX, WATER_Y, IN.maxZ) },
  uCaustic: { value: 1.0 },
  uFloorY: { value: 0.8 },
  uSurfY: { value: WATER_Y },
  uDepthDark: { value: 0.6 },
  uLampColor: { value: new THREE.Color(1.0, 0.97, 0.9) },
};

// Длина пути луча в воде от камеры до точки, поглощение/рассеяние, каустики
const GLSL_WATER = /* glsl */`
uniform float uTime;
uniform vec3 uWaterColor;
uniform vec3 uAbsorb;
uniform float uScatter;
uniform vec3 uBoxMin;
uniform vec3 uBoxMax;
uniform float uCaustic;
uniform float uFloorY;
uniform float uSurfY;
uniform float uDepthDark;
uniform vec3 uLampColor;
float uwPath(vec3 wp) {
  vec3 ro = cameraPosition;
  vec3 rd = wp - ro;
  float L = length(rd);
  rd /= max(L, 1e-5);
  vec3 safe = mix(rd, vec3(1e-6), step(abs(rd), vec3(1e-6)));
  vec3 inv = 1.0 / safe;
  vec3 t0 = (uBoxMin - ro) * inv, t1 = (uBoxMax - ro) * inv;
  vec3 tn = min(t0, t1), tf = max(t0, t1);
  float te = max(max(tn.x, tn.y), tn.z);
  float tx = min(min(tf.x, tf.y), tf.z);
  return max(min(tx, L) - max(te, 0.0), 0.0);
}
vec3 uwApply(vec3 col, vec3 wp) {
  float d = uwPath(wp);
  return col * exp(-uAbsorb * d) + uWaterColor * (1.0 - exp(-uScatter * d));
}
float uwCaustic(vec2 uv, float time) {
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p;
  float c = 1.0;
  float inten = 0.005;
  for (int n = 0; n < 5; n++) {
    float t = time * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
  }
  c /= 5.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
`;

const GLSL_UW_APPLY = /* glsl */`
{
  float dk = clamp((vWPos.y - uFloorY) / (uSurfY - uFloorY), 0.0, 1.0);
  vec2 cuv = vWPos.xz * 0.27 + vec2(0.06, 0.03) * (uSurfY - vWPos.y);
  float c1 = uwCaustic(cuv, uTime * 0.45);
  float c2 = uwCaustic(cuv * 0.63 + 3.7, uTime * 0.33);
  float cs = smoothstep(0.1, 0.75, c1) * 1.3 + smoothstep(0.2, 0.9, c2) * 0.5;
  outgoingLight += reflectedLight.directDiffuse * cs * cs * uCaustic * 1.8;
  outgoingLight *= mix(uDepthDark, 1.0, dk);
  outgoingLight = uwApply(outgoingLight, vWPos);
}
`;

/**
 * Превращает стандартный материал в «подводный»: каустики, поглощение света водой,
 * плюс опциональные вершинные деформации (плавание рыб, колыхание растений).
 */
function underwater(mat, opt = {}) {
  const key = 'uw-' + (opt.key || 'base') + (opt.depth ? '-depth' : '');
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U, opt.uniforms || {});
    let vs = sh.vertexShader;
    vs = vs.replace('#include <common>', `#include <common>\nuniform float uTime;\nvarying vec3 vWPos;\n${opt.vpars || ''}`);
    if (opt.normal && !opt.depth) vs = vs.replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>\n${opt.normal}`);
    if (opt.local) vs = vs.replace('#include <begin_vertex>', `#include <begin_vertex>\n${opt.local}`);
    vs = vs.replace('#include <project_vertex>', /* glsl */`
      vec4 uwW = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        uwW = instanceMatrix * uwW;
      #endif
      uwW = modelMatrix * uwW;
      ${opt.world || ''}
      vWPos = uwW.xyz;
      vec4 mvPosition = viewMatrix * uwW;
      gl_Position = projectionMatrix * mvPosition;`);
    sh.vertexShader = vs;
    if (!opt.depth) {
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>\n${GLSL_WATER}\nvarying vec3 vWPos;`)
        .replace('#include <opaque_fragment>', `${GLSL_UW_APPLY}\n#include <opaque_fragment>`);
    }
  };
  return mat;
}
const depthMat = (opt) => underwater(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }), { ...opt, depth: true });

/* =====================================================================
   Свет
   ===================================================================== */
const hemi = new THREE.HemisphereLight(0x9fdcff, 0x1d2a1c, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3e2, 2.7);
sun.position.set(2.2, 24, 3.2);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 12, far: 30 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

const tankGlow = new THREE.PointLight(0x6fcfff, 26, 22, 2);
tankGlow.position.set(0, 2.4, 6.5);
scene.add(tankGlow);

const roomKey = new THREE.SpotLight(0xffc999, 160, 60, 0.55, 0.9, 2);
roomKey.position.set(-14, 14, 12);
roomKey.target.position.set(0, -2, 0);
scene.add(roomKey, roomKey.target);

/* =====================================================================
   Комната: пол, стена, тумба
   ===================================================================== */
function woodTexture() {
  const [c, g] = makeCanvas(1024, 512);
  g.fillStyle = '#3b2719'; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 320; i++) {
    const y = rand() * 512, amp = rr(1, 7), f = rr(0.002, 0.012), ph = rr(0, TAU);
    const light = rand() < 0.45;
    g.strokeStyle = light ? `rgba(120, 84, 52, ${rr(0.08, 0.28)})` : `rgba(20, 10, 4, ${rr(0.1, 0.35)})`;
    g.lineWidth = rr(0.5, 2.8);
    g.beginPath();
    for (let x = -10; x <= 1034; x += 12) g.lineTo(x, y + Math.sin(x * f + ph) * amp + fbm3(x * 0.01, y * 0.05, i, 2) * 6);
    g.stroke();
  }
  for (let i = 0; i < 6; i++) { // сучки
    const x = rr(50, 970), y = rr(40, 470);
    for (let r = 26; r > 2; r -= 3) { g.strokeStyle = `rgba(25,12,5,${0.08 + (26 - r) * 0.008})`; g.lineWidth = 1.4;
      g.beginPath(); g.ellipse(x, y, r * 2.2, r * 0.7, 0, 0, TAU); g.stroke(); }
  }
  return canvasTex(c);
}
const roomMat = (o) => new THREE.MeshStandardMaterial(o);
{
  const [c, g] = makeCanvas(512, 512);
  const grd = g.createRadialGradient(256, 256, 10, 256, 256, 256);
  grd.addColorStop(0, '#2c2722'); grd.addColorStop(0.5, '#16130f'); grd.addColorStop(1, '#0a0908');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), roomMat({ map: canvasTex(c), roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -4.7; floor.receiveShadow = true;
  scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(90, 40), roomMat({ color: 0x151a20, roughness: 0.95 }));
  wall.position.set(0, 15, -13);
  scene.add(wall);

const GLSL_WAVES = /* glsl */`
uniform vec4 uRip[10];
uniform vec3 uAgit;
float waveH(vec2 p) {

  h += sin(dot(p, vec2(0.9, 0.4)) * 2.3 + t * 1.3) * 0.010;
  h += sin(dot(p, vec2(-0.5, 0.85)) * 3.1 + t * 1.7) * 0.008;

  let g = new THREE.IcosahedronGeometry(1, detail);

  g = mergeVertices(g);
  const p = g.attributes.position, v = new THREE.Vector3();
  // плоские сколы придают камню рубленую форму
  const planes = [];
  for (let k = 0; k < cuts; k++) planes.push([new THREE.Vector3(rr(-1, 1), rr(-0.3, 1), rr(-1, 1)).normalize(), rr(0.6, 0.86)]);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = fbm3(v.x * 1.2 + seed, v.y * 1.2 + seed * 0.7, v.z * 1.2 - seed, 5);
    const r = 1 - Math.abs(vnoise3(v.x * 2.4 + seed, v.y * 3.1, v.z * 2.4 - seed));
    v.multiplyScalar(1 + n * 0.32 + r * ridge);
    for (const [pn, pd] of planes) { const d = v.dot(pn); if (d > pd) v.addScaledVector(pn, -(d - pd) * 0.93); }
    v.multiplyScalar(1 + 0.025 * vnoise3(v.x * 9 + seed, v.y * 9, v.z * 9));
    if (v.y < -0.35) v.y = -0.35 + (v.y + 0.35) * 0.35;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

    const crev = 0.45 + 0.55 * smooth(-0.6, 0.2, fbm3(x * 9 - seed, y * 9, z * 9, 3));

    r = lerp(r, 0.62, vein); gg = lerp(gg, 0.62, vein); b = lerp(b, 0.6, vein);

    r = lerp(r, 0.05, up * 0.7); gg = lerp(gg, 0.12, up * 0.7); b = lerp(b, 0.03, up * 0.7);

    if (d.s[1] > 1) obstacles.push({ x: d.x, y: y + d.s[1] * 0.85, z: d.z, r: Math.max(d.s[0], d.s[2]) * 0.75 });
  });

  const pg = rockGeometry(3, 99, 0.05, 3); colorRock(pg, [0.36, 0.34, 0.3], 7, 0);

const barkTex = (() => {
  const [c, g] = makeCanvas(512, 128);

  for (let i = 0; i < 260; i++) {
    const y = rand() * 128; g.strokeStyle = rand() < 0.5 ? `rgba(20,10,5,${rr(0.15, 0.5)})` : `rgba(140,105,70,${rr(0.1, 0.3)})`;
    g.lineWidth = rr(0.5, 2.5); g.beginPath();
    for (let x = -5; x < 520; x += 8) g.lineTo(x, y + Math.sin(x * 0.02 + i) * 3 + fbm3(x * 0.02, i, 0.5, 2) * 6);
    g.stroke();

})();
const woodMat = underwater(new THREE.MeshStandardMaterial({ map: barkTex, roughness: 0.82, color: 0xd8c0a8, bumpMap: barkTex, bumpScale: 2 }), { key: 'wood' });
const woodAttach = []; // точки для папоротника
{
  const root = new THREE.Vector3(3.9, sandHeight(3.9, -0.6) - 0.15, -0.6);
  const parts = [];
  const lim = (v) => { v.x = clamp(v.x, IN.minX + 0.35, IN.maxX - 0.35); v.z = clamp(v.z, IN.minZ + 0.35, IN.maxZ - 0.35); v.y = clamp(v.y, 0.3, WATER_Y - 0.6); return v; };
  function branch(start, dir, len, r0, depth) {
    const pts = [start.clone()];
    const d = dir.clone().normalize();
    let p = start.clone();
    const steps = 5;
    for (let i = 1; i <= steps; i++) {
      d.x += rr(-0.35, 0.35); d.z += rr(-0.3, 0.3); d.y += rr(-0.15, 0.2); d.normalize();
      p = lim(p.clone().addScaledVector(d, len / steps));
      pts.push(p);
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const TS = 40, RS = 10;
    const g = new THREE.TubeGeometry(curve, TS, 1, RS, false);
    const pos = g.attributes.position, P = new THREE.Vector3(), V = new THREE.Vector3();
    for (let i = 0; i <= TS; i++) {
      curve.getPointAt(i / TS, P);
      const t = i / TS, r = lerp(r0, r0 * 0.12, Math.pow(t, 0.8)) * (1 + 0.15 * Math.sin(t * 23 + depth));
      for (let j = 0; j <= RS; j++) {
        const k = i * (RS + 1) + j;
        V.fromBufferAttribute(pos, k).sub(P).multiplyScalar(r * (1 + 0.12 * vnoise3(t * 9, j * 0.7, depth))).add(P);
        pos.setXYZ(k, V.x, V.y, V.z);
      }
    }
    const uv = g.attributes.uv; const L = curve.getLength();
    for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * L / 1.6);
    g.computeVertexNormals();
    parts.push(g);
    for (let t = 0.1; t < 1; t += 0.12) {
      const q = curve.getPointAt(t), rr_ = lerp(r0, r0 * 0.12, Math.pow(t, 0.8));
      if (rr_ > 0.05) obstacles.push({ x: q.x, y: q.y, z: q.z, r: rr_ + 0.1 });
    }
    woodAttach.push(curve.getPointAt(0.55), curve.getPointAt(0.8));
    if (depth < 2) {
      const kids = depth === 0 ? 2 : 1;
      for (let k = 0; k < kids; k++) {
        const t = rr(0.35, 0.75), s = curve.getPointAt(t), tg = curve.getTangentAt(t);
        const nd = tg.clone().add(new THREE.Vector3(rr(-1, 1), rr(0.1, 0.8), rr(-0.8, 0.8))).normalize();
        branch(s, nd, len * rr(0.45, 0.65), lerp(r0, r0 * 0.12, t) * 0.75, depth + 1);
      }
    }
  }
  branch(root, new THREE.Vector3(-0.55, 1, -0.3), 5.6, 0.24, 0);
  branch(root.clone().add(new THREE.Vector3(0.2, 0, 0.1)), new THREE.Vector3(0.6, 0.85, -0.45), 4.4, 0.2, 0);
  branch(root.clone().add(new THREE.Vector3(0.3, 0.05, 0.3)), new THREE.Vector3(1, 0.25, 0.55), 2.9, 0.17, 1);
  branch(root.clone().add(new THREE.Vector3(-0.3, 0.1, 0.2)), new THREE.Vector3(-1, 0.45, 0.6), 2.6, 0.14, 1);
  const wood = new THREE.Mesh(mergeGeometries(parts), woodMat);
  wood.castShadow = wood.receiveShadow = true;
  scene.add(wood);
}

// колыхание в мировых координатах; aSway = (фаза, высота основания, гибкость)
const SWAY_GLSL = /* glsl */`
{
  float hh = max(uwW.y - aSway.y, 0.0);
  float amp = aSway.z * hh * hh;
  float ph = aSway.x;
  vec2 d = vec2(
    sin(uTime * 0.9 + ph + uwW.x * 0.3) * 0.6 + sin(uTime * 2.1 + ph * 1.7 + hh * 1.2) * 0.25,
    cos(uTime * 0.7 + ph * 1.3 + uwW.z * 0.35) * 0.45 + sin(uTime * 1.7 + ph * 2.9) * 0.15);
  d += vec2(0.5, 0.12);
  vec2 off = d * amp;
  uwW.xz += off;
  uwW.y -= dot(off, off) / max(2.0 * hh, 0.15);
}`;
const plantOpt = { key: 'plant', vpars: 'attribute vec3 aSway;', world: SWAY_GLSL };
const plantMat = underwater(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55, metalness: 0 }), plantOpt);
const plantDepth = depthMat(plantOpt);

function ribbonGeo(seg, width, lean, twist, tipFrac, cBase, cTip) {
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const w = width * (t < 1 - tipFrac ? lerp(0.85, 1, smooth(0, 0.2, t)) : Math.sqrt(Math.max(0, (1 - t) / tipFrac)));
    const a = twist * t;
    for (const s of [-1, 1]) {
      const xw = s * w / 2;
      pos.push(lean * t * t + Math.cos(a) * xw, t, Math.sin(a) * xw);
      const k = s > 0 ? 1 : 0.9;
      col.push(lerp(cBase[0], cTip[0], t) * k, lerp(cBase[1], cTip[1], t) * k, lerp(cBase[2], cTip[2], t) * k);
    }
    if (i < seg) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function leafGeo(len, maxW, petiole, arch, fold, cBase, cTip) {
  const SL = 16, SW = 6, pos = [], col = [], idx = [];
  let cx = 0, cy = 0, ang = 0.1;
  const step = len / SL;
  for (let i = 0; i <= SL; i++) {
    const t = i / SL;
    const w = t < petiole ? maxW * 0.08 : maxW * Math.pow(Math.max(0, Math.sin(Math.PI * (t - petiole) / (1 - petiole))), 0.8);
    const nx = -Math.cos(ang), ny = Math.sin(ang);
    for (let j = 0; j <= SW; j++) {
      const s = j / SW * 2 - 1;
      const f = Math.abs(s) * fold * w;
      pos.push(cx + nx * f, cy + ny * f, s * w / 2);
      const rib = 1 + 0.35 * Math.pow(1 - Math.abs(s), 10) - 0.12 * Math.abs(s);
      const pt = t < petiole ? 1.15 : 1;
      col.push(lerp(cBase[0], cTip[0], t) * rib * pt, lerp(cBase[1], cTip[1], t) * rib * pt, lerp(cBase[2], cTip[2], t) * rib);
    }
    cx += Math.sin(ang) * step; cy += Math.cos(ang) * step;
    ang += arch / SL;
  }
  for (let i = 0; i < SL; i++) for (let j = 0; j < SW; j++) {
    const a = i * (SW + 1) + j, b = a + 1, c = a + SW + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function plantMesh(geo, list, shadow = true) {
  const n = list.length;
  const mesh = new THREE.InstancedMesh(geo, plantMat, n);
  const sway = new Float32Array(n * 3);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), c = new THREE.Color();
  list.forEach((it, i) => {
    q.setFromEuler(e.set(it.rx || 0, it.ry || 0, it.rz || 0, 'YXZ'));
    m4.compose(it.p, q, it.s);
    mesh.setMatrixAt(i, m4);
    mesh.setColorAt(i, c.setRGB(...it.c));
    sway[i * 3] = it.ph ?? rr(0, TAU); sway[i * 3 + 1] = it.base ?? it.p.y; sway[i * 3 + 2] = it.flex;
  });
  geo.setAttribute('aSway', new THREE.InstancedBufferAttribute(sway, 3));
  mesh.customDepthMaterial = plantDepth;
  mesh.castShadow = shadow; mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

{
  const stems = [], leaves = [];
  const groups = [[-5.6, -2.45, 0.85, 34], [-4.2, -2.2, 0.6, 18], [1.5, -2.35, 0.6, 16]];
  for (const [gx, gz, gr, n] of groups) for (let i = 0; i < n; i++) {

    let ang = rr(0, TAU);

{

{

// Ситняг — травяной ковёр переднего плана
{
  const list = [];
  const patches = [[-4.6, 1.6, 1.9], [-2.4, 0.2, 1.4], [-5.8, 0.3, 1.0], [3.4, 1.5, 1.8], [5.7, 2.2, 1.2], [2.6, -0.4, 1.0], [-1.3, 2.3, 0.9], [-3.7, -1.8, 0.9]];
  const pathX = (z) => 0.5 + Math.sin(z * 0.8) * 0.8;

  while (list.length < 3600 && tries++ < 20000) {
    const [px, pz, pr] = pick(patches);
    const r = Math.sqrt(rand()) * pr, a = rr(0, TAU);
    const x = px + Math.cos(a) * r, z = pz + Math.sin(a) * r * 0.75;
    if (x < IN.minX + 0.1 || x > IN.maxX - 0.1 || z < IN.minZ + 0.1 || z > IN.maxZ - 0.08) continue;

    const base = sandHeight(x, z) - 0.03;
    const edge = 1 - r / pr;
    const g = rr(0.75, 1.2);
    list.push({ p: V3(x, base, z), s: V3(1, rr(0.2, 0.62) * (0.55 + 0.45 * edge), 1), ry: rr(0, TAU), rx: rr(-0.25, 0.25),

const BUB_MAX = 420;

  uniforms: { ...U, uLight: { value: 1 } },
  vertexShader: /* glsl */`
    varying vec3 vN; varying vec3 vWPos;
    void main() {
      vec4 w = modelMatrix * instanceMatrix * vec4(position, 1.0);
      vWPos = w.xyz; vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;

  fragmentShader: /* glsl */`

bubbleMesh.frustumCulled = false;
bubbleMesh.renderOrder = 4;
scene.add(bubbleMesh);
function spawnBubble(x, y, z, r) {
  const i = bubbles.next; bubbles.next = (i + 1) % BUB_MAX;
  bubbles.pos[i * 3] = x; bubbles.pos[i * 3 + 1] = y; bubbles.pos[i * 3 + 2] = z;
  bubbles.r[i] = r; bubbles.ph[i] = rand() * TAU; bubbles.alive[i] = 1;
}

const rayUniforms = { ...U, uRayDir: { value: new THREE.Vector3(-0.12, -1, -0.08).normalize() }, uRayLen: { value: 6.8 }, uRay: { value: 1 } };
{

  for (let i = 0; i < N; i++) a.set([rr(IN.minX + 1.2, IN.maxX - 0.6), rr(IN.minZ + 0.8, IN.maxZ - 0.6), rr(0.25, 0.9), rand()], i * 4);

    fragmentShader: /* glsl */`
      ${GLSL_WATER}
      uniform float uRay;
      varying vec2 vUv; varying float vPh; varying vec3 vWPos; varying float vFace;
      void main() {

        float a = across * pow(1.0 - along, 1.5) * smoothstep(0.0, 0.08, along) * fl;

/* =====================================================================
   РЫБЫ: процедурная геометрия
   ===================================================================== */
// Раскладка текстуры: нижние 85% — боковая проекция рыбы, верхняя полоса — глаз и парные плавники
const TEX_W = 1024, TEX_H = 512, PROJ_V = 0.85;
const SW_EYE = { cu: 40 / TEX_W, cv: 1 - 40 / TEX_H, ru: 34 / TEX_W, rv: 34 / TEX_H };
const SW_PECT = { u0: 0.2, u1: 0.5, v0: 1 - 70 / TEX_H, v1: 1 - 6 / TEX_H };
const SW_PELV = { u0: 0.55, u1: 0.85, v0: 1 - 70 / TEX_H, v1: 1 - 6 / TEX_H };

function buildFish(D) {
  const nr = D.noseR;
  const round = (u) => { const t = Math.min(1, u / nr); return Math.sqrt(t * (2 - t)); };
  const topS = spline(D.top), botS = spline(D.bot), widS = spline(D.wid), ycS = spline(D.yc || [[0, 0], [1, 0]]);
  const top = (u) => topS(u) * round(u), bot = (u) => botS(u) * round(u), wid = (u) => widS(u) * round(u), yc = ycS;
  const shape = { top, bot, wid, yc, D };

  function mk(pos, idx, fin, uv) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aFin', new THREE.Float32BufferAttribute(fin, 2));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  }
  function grid(na, nb, fn, type, swatch) {
    const pos = [], fin = [], uv = [], idx = [];
    for (let i = 0; i <= na; i++) for (let j = 0; j <= nb; j++) {
      const a = i / na, b = j / nb, p = fn(a, b);
      pos.push(p[0], p[1], p[2]); fin.push(type, b);
      if (swatch) uv.push(lerp(swatch.u0, swatch.u1, b), lerp(swatch.v0, swatch.v1, a)); else uv.push(0, 0);
    }
    for (let i = 0; i < na; i++) for (let j = 0; j < nb; j++) {
      const a = i * (nb + 1) + j, b = a + 1, c = a + nb + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    return mk(pos, idx, fin, uv);
  }

  // тело
  const NR = 46, NS = 24, P = [], I = [], F = [];
  for (let i = 0; i <= NR; i++) {
    const u = Math.pow(i / NR, 1.35), x = 0.5 - u;
    for (let j = 0; j < NS; j++) {
      const a = j / NS * TAU, ca = Math.cos(a), sa = Math.sin(a);
      const ex = D.flat ?? 1;
      const zc = Math.sign(ca) * Math.pow(Math.abs(ca), ex);
      P.push(x, yc(u) + (sa >= 0 ? top(u) : bot(u)) * sa, wid(u) * zc); F.push(0, 0);
    }
  }
  for (let i = 0; i < NR; i++) for (let j = 0; j < NS; j++) {
    const a = i * NS + j, b = i * NS + (j + 1) % NS, c = (i + 1) * NS + j, d = (i + 1) * NS + (j + 1) % NS;
    I.push(a, b, c, b, d, c);
  }
  const ci = P.length / 3; P.push(-0.51, yc(1), 0); F.push(0, 0);
  for (let j = 0; j < NS; j++) I.push(NR * NS + j, NR * NS + (j + 1) % NS, ci);
  const body = mk(P, I, F, new Array(P.length / 3 * 2).fill(0));

  // хвостовой плавник
  const C = D.caudal, r1 = Math.max(top(1), bot(1)) * 0.95, y1 = yc(1), xb = -0.5 + 0.04;
  const edge = C.type === 'fork' ? (s) => 0.58 + 0.42 * Math.pow(Math.abs(s), 1.3)
    : C.type === 'lyre' ? (s) => 0.7 + 0.6 * Math.pow(Math.abs(s), 6)
    : (s) => 1 - 0.2 * s * s;
  const caudal = grid(14, 10, (a, b) => { const s = a * 2 - 1; return [xb - b * C.len * edge(s), y1 + s * lerp(r1, C.spread, Math.pow(b, 0.8)), 0]; }, 1);

  // непарные плавники: спинной, анальный, жировой
  const shapes = {
    tri: (a) => Math.pow(1 - a * 0.88, 0.9),
    sail: (a) => Math.pow(1 - a * 0.97, 1.1),
    band: (a) => smooth(0, 0.14, a) * smooth(1, 0.82, a),
    round: (a) => Math.pow(Math.max(0, Math.sin(Math.PI * a)), 0.7),
  };
  function median(Fd, isTop) {
    const sh = shapes[Fd.shape || 'tri'];
    const edgeY = (u) => (isTop ? yc(u) + top(u) : yc(u) - bot(u));
    return grid(18, 8, (a, b) => {
      const u = lerp(Fd.u0, Fd.u1, a), x = 0.5 - u;
      const slope = (edgeY(Math.min(u + 0.01, 1)) - edgeY(Math.max(u - 0.01, 0))) / 0.02;
      const n = isTop ? new THREE.Vector2(slope, 1) : new THREE.Vector2(-slope, -1);
      n.normalize(); n.lerp(new THREE.Vector2(0, isTop ? 1 : -1), Fd.vert ?? 0.4).normalize();
      const H = Fd.h * sh(a);
      const yE = yc(u) + (isTop ? top(u) : -bot(u)) * 0.88;
      return [x + n.x * H * b - Fd.sweep * Math.pow(b, 1.25) * (1 - 0.4 * a), yE + n.y * H * b, 0];
    }, 2);
  }
  const med = [];
  if (D.dorsal) med.push(median(D.dorsal, true));
  if (D.anal) med.push(median(D.anal, false));
  if (D.adipose) med.push(median({ ...D.adipose, shape: 'round', sweep: 0.01, vert: 0.8 }, true));

  // парные плавники
  function paired(Fd, type, sw, below) {
    const out = [];
    for (const side of [1, -1]) {
      const u = Fd.u, x = 0.5 - u;
      const A = below ? [x, yc(u) - bot(u) * 0.8, side * wid(u) * 0.45] : [x, yc(u) - bot(u) * 0.3, side * wid(u) * 0.88];
      const Dv = new THREE.Vector3(...(Fd.dir || (below ? [-0.8, -0.6, 0.25] : [-1, -0.3, 0.55])));
      Dv.z *= side; Dv.normalize();
      const Wv = new THREE.Vector3(-Dv.y, Dv.x, 0).normalize();
      out.push(grid(4, 8, (a, b) => {
        const wb = Fd.w * Math.pow(Math.max(0, Math.sin(Math.PI * (0.12 + 0.88 * b))), 0.6) * (Fd.filament ? lerp(1, 0.25, b) : 1);
        const L = Fd.len;
        return [A[0] + Dv.x * b * L + Wv.x * (a - 0.5) * wb, A[1] + Dv.y * b * L + Wv.y * (a - 0.5) * wb, A[2] + Dv.z * b * L];
      }, type, sw));
    }
    return out;
  }
  const pect = paired(D.pect, 3, SW_PECT, false);
  const pelv = D.pelv ? paired(D.pelv, 4, SW_PELV, true) : [];

  // глаза
  const eyes = [];
  {
    const E = D.eye, u = E.u, x = 0.5 - u, y = yc(u) + E.y;
    const sa = clamp(E.y / Math.max(top(u), 1e-3), -0.95, 0.95);
    const zs = wid(u) * Math.sqrt(1 - sa * sa);
    for (const side of [1, -1]) {
      const g = new THREE.SphereGeometry(E.r, 16, 12);
      g.translate(x, y, side * (zs - E.r * 0.42));
      const p = g.attributes.position, uv = g.attributes.uv;
      for (let i = 0; i < p.count; i++) uv.setXY(i, SW_EYE.cu + (p.getX(i) - x) / E.r * SW_EYE.ru, SW_EYE.cv + (p.getY(i) - y) / E.r * SW_EYE.rv);
      g.setAttribute('aFin', new THREE.Float32BufferAttribute(new Array(p.count * 2).fill(0), 2));
      eyes.push(g);
    }
  }

  // боковая проекция → UV для тела и непарных плавников
  const projParts = [body, caudal, ...med];
  const b = { minX: 1e9, maxX: -1e9, minY: 1e9, maxY: -1e9 };
  for (const g of projParts) { const p = g.attributes.position; for (let i = 0; i < p.count; i++) {
    b.minX = Math.min(b.minX, p.getX(i)); b.maxX = Math.max(b.maxX, p.getX(i)); b.minY = Math.min(b.minY, p.getY(i)); b.maxY = Math.max(b.maxY, p.getY(i)); } }
  b.minX -= 0.01; b.maxX += 0.01; b.minY -= 0.01; b.maxY += 0.01;
  for (const g of projParts) { const p = g.attributes.position, uv = g.attributes.uv; for (let i = 0; i < p.count; i++)
    uv.setXY(i, (p.getX(i) - b.minX) / (b.maxX - b.minX), (p.getY(i) - b.minY) / (b.maxY - b.minY) * PROJ_V); }
  shape.bounds = b;
  shape.caudal = { xb, r1, y1, len: C.len, spread: C.spread, edge };

  const bodyGeo = mergeGeometries([body, ...eyes]);
  const finGeo = mergeGeometries([caudal, ...med, ...pect, ...pelv]);
  bodyGeo.computeBoundingSphere(); finGeo.computeBoundingSphere();
  return { bodyGeo, finGeo, shape };
}

/* ---------- раскраска рыб на canvas ---------- */
function fishPainter(shape) {
  const [cv, ctx] = makeCanvas(TEX_W, TEX_H);
  const b = shape.bounds;
  const X = (x) => (x - b.minX) / (b.maxX - b.minX) * TEX_W;
  const Y = (y) => TEX_H * (1 - PROJ_V * (y - b.minY) / (b.maxY - b.minY));
  const S = shape;
  const P = { cv, ctx, X, Y, S, W: TEX_W, H: TEX_H };
  P.edgeTop = (u) => S.yc(u) + S.top(u);
  P.edgeBot = (u) => S.yc(u) - S.bot(u);
  P.body = () => {
    const p = new Path2D(), N = 90;
    for (let i = 0; i <= N; i++) { const u = i / N; const fn = i ? 'lineTo' : 'moveTo'; p[fn](X(0.5 - u), Y(P.edgeTop(u))); }
    for (let i = N; i >= 0; i--) { const u = i / N; p.lineTo(X(0.5 - u), Y(P.edgeBot(u))); }
    p.closePath(); return p;
  };
  P.poly = (u0, u1, fUp, fLo, n = 40) => {
    const p = new Path2D();
    for (let i = 0; i <= n; i++) { const u = lerp(u0, u1, i / n); const fn = i ? 'lineTo' : 'moveTo'; p[fn](X(0.5 - u), Y(fUp(u))); }
    for (let i = n; i >= 0; i--) { const u = lerp(u0, u1, i / n); p.lineTo(X(0.5 - u), Y(fLo(u))); }
    p.closePath(); return p;
  };
  P.gradient = (stops) => {
    for (let px = Math.floor(X(-0.52)); px <= Math.ceil(X(0.5)) + 1; px++) {
      const x = b.minX + px / TEX_W * (b.maxX - b.minX);
      const u = clamp(0.5 - x, 0, 1);
      const yt = Y(P.edgeTop(u)), yb = Y(P.edgeBot(u));
      const g = ctx.createLinearGradient(0, yt, 0, yb);
      for (const [t, c] of stops) g.addColorStop(t, c);
      ctx.fillStyle = g; ctx.fillRect(px, yt - 3, 1.6, yb - yt + 6);
    }
  };
  P.scales = (color, size = 11) => {
    ctx.save(); ctx.clip(P.body()); ctx.strokeStyle = color; ctx.lineWidth = 1;
    let row = 0;
    for (let y = 0; y < TEX_H; y += size * 0.62, row++) for (let x = (row % 2) * size * 0.5; x < TEX_W; x += size) {
      ctx.beginPath(); ctx.arc(x, y, size * 0.6, 0.62 * Math.PI, 1.38 * Math.PI); ctx.stroke();
    }
    ctx.restore();
  };
  P.rays = (color, n = 22) => {
    const c = S.caudal; ctx.strokeStyle = color; ctx.lineWidth = 1.2;
    for (let k = 0; k <= n; k++) { const s = k / n * 2 - 1;
      ctx.beginPath(); ctx.moveTo(X(c.xb), Y(c.y1 + s * c.r1)); ctx.lineTo(X(c.xb - c.len * c.edge(s)), Y(c.y1 + s * c.spread)); ctx.stroke(); }
  };
  P.eye = (iris, ring) => {
    const cx = SW_EYE.cu * TEX_W, cy = (1 - SW_EYE.cv) * TEX_H, R = 38;
    ctx.fillStyle = ring; ctx.fillRect(cx - R - 2, cy - R - 2, R * 2 + 4, R * 2 + 4);
    const g = ctx.createRadialGradient(cx, cy, 6, cx, cy, R * 0.95);
    g.addColorStop(0, '#000'); g.addColorStop(0.42, '#020202'); g.addColorStop(0.5, iris); g.addColorStop(0.85, iris); g.addColorStop(1, ring);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  };
  P.swatch = (sw, c0, c1) => {
    const x0 = sw.u0 * TEX_W, x1 = sw.u1 * TEX_W, y0 = (1 - sw.v1) * TEX_H - 4, y1 = (1 - sw.v0) * TEX_H + 4;
    const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.clearRect(x0 - 4, y0, x1 - x0 + 8, y1 - y0); ctx.fillStyle = g; ctx.fillRect(x0 - 4, y0, x1 - x0 + 8, y1 - y0);
  };
  return P;
}

/* ---------- шейдер плавания ---------- */
const FISH_VPARS = /* glsl */`
attribute vec4 aSwim;
attribute vec2 aFin;
uniform float uWaveK;
uniform float uEnv0;
float fishLat(float x, out float slope) {
  float s = max(0.5 - x, 0.0);
  float env = uEnv0 + s * s;
  float ph = uWaveK * s - aSwim.x;
  float w = sin(ph);
  slope = -(aSwim.y * (2.0 * s * w + env * uWaveK * cos(ph)) + 2.0 * aSwim.z * s);
  return aSwim.y * env * w + aSwim.z * s * s;
}`;
const FISH_LOCAL = /* glsl */`
{
  float sl;
  float lat = fishLat(transformed.x, sl);
  float fw = aFin.y;
  if (aFin.x > 2.5 && aFin.x < 3.5) {
    float side = sign(transformed.z);
    transformed.z += side * (sin(aSwim.w) * 0.5 + 0.2) * fw * 0.11;
    transformed.y += cos(aSwim.w) * fw * 0.025;
  } else if (aFin.x > 3.5) {
    float side = sign(transformed.z);
    transformed.z += side * (sin(aSwim.w * 0.7 + 1.0) * 0.5 + 0.3) * fw * 0.05;
  } else if (aFin.x > 0.5 && aFin.x < 1.5) {
    lat += sin(uWaveK * 1.15 * (0.5 - transformed.x) - aSwim.x - 0.7) * aSwim.y * fw * 0.5;
  } else if (aFin.x > 1.5) {
    lat += sin(aSwim.x * 0.7 + transformed.x * 9.0) * fw * fw * 0.025;
  }
  transformed.z += lat;
}`;
const FISH_NORMAL = /* glsl */`
{ float sl; fishLat(position.x, sl); objectNormal = normalize(vec3(objectNormal.x - sl * objectNormal.z, objectNormal.y, objectNormal.z)); }`;

const fishMeshes = [];
const allFish = [];
const RAY_SPHERE = new THREE.Sphere(new THREE.Vector3(0, 3.6, 0), 12);
for (const sp of SPECIES) {
  const { bodyGeo, finGeo, shape } = buildFish(sp.shape);
  const P = fishPainter(shape);
  const extra = sp.paint(P) || {};
  const map = canvasTex(P.cv);
  const uni = { uWaveK: { value: sp.swim.k }, uEnv0: { value: sp.swim.env0 } };
  const opt = { key: 'fish', vpars: FISH_VPARS, local: FISH_LOCAL, normal: FISH_NORMAL, uniforms: uni };
  const bodyMat = underwater(new THREE.MeshStandardMaterial({
    map, roughness: 0.34, metalness: 0.12, envMap: envTex, envMapIntensity: 1.1,
    ...(extra.emissive ? { emissiveMap: canvasTex(extra.emissive), emissive: 0xffffff, emissiveIntensity: 0.35 } : {}),
  }), opt);
  const finMat = underwater(new THREE.MeshStandardMaterial({ map, roughness: 0.55, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    envMap: envTex, envMapIntensity: 0.3 }), opt);
  const body = new THREE.InstancedMesh(bodyGeo, bodyMat, sp.max);
  const fins = new THREE.InstancedMesh(finGeo, finMat, sp.max);
  body.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  fins.instanceMatrix = body.instanceMatrix;
  const swim = new THREE.InstancedBufferAttribute(new Float32Array(sp.max * 4), 4);
  swim.setUsage(THREE.DynamicDrawUsage);
  bodyGeo.setAttribute('aSwim', swim); finGeo.setAttribute('aSwim', swim);
  body.customDepthMaterial = depthMat(opt);
  body.castShadow = true; body.receiveShadow = true; fins.receiveShadow = true;
  body.frustumCulled = fins.frustumCulled = false;
  body.boundingSphere = RAY_SPHERE.clone();
  fins.renderOrder = 3;
  body.userData.species = sp;
  scene.add(body, fins);
  Object.assign(sp, { body, fins, swimAttr: swim, fish: [], uni, bodyMat, schoolTarget: new THREE.Vector3(), schoolTimer: 0 });
  fishMeshes.push(body);
}

    if (bubbles.pos[k + 1] > WATER_Y - r * 0.6) {
      bubbles.alive[i] = 0;
      if (r > 0.04 && (popSound -= 1) < 0) { sfx.bubble(); popSound = 2; }
      continue;
    }
    const sq_ = 1 - Math.min(r * 3, 0.25) * (0.5 + 0.5 * Math.sin(t * 20 + bubbles.ph[i]));
    _m4.makeScale(r / Math.sqrt(sq_), r * sq_, r / Math.sqrt(sq_)).setPosition(bubbles.pos[k], bubbles.pos[k + 1], bubbles.pos[k + 2]);
    bubbleMesh.setMatrixAt(i, _m4);
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;
}

/* =====================================================================
   Звук (WebAudio, синтез без файлов)
   ===================================================================== */
const sfx = (() => {
  let ctx = null, master = null, on = false;
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = ctx.createGain(); g.gain.value = 0.55;
    src.connect(lp).connect(g).connect(master); src.start();
  }
  function blip(f0, f1, dur, vol, type = 'sine') {
    if (!on || !ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    toggle() { if (!ctx) init(); on = !on; if (ctx.state === 'suspended') ctx.resume();
      master.gain.setTargetAtTime(on ? 0.7 : 0, ctx.currentTime, 0.3); return on; },
    bubble() { const f = rr(380, 900); blip(f, f * rr(1.8, 2.6), rr(0.04, 0.08), 0.05); },
    plop() { blip(220, 520, 0.12, 0.12); setTimeout(() => blip(500, 1100, 0.06, 0.05), 60); },
    tap() { blip(1800, 900, 0.03, 0.25, 'triangle'); blip(140, 70, 0.12, 0.3); },
  };
})();

/* =====================================================================
   День / ночь
   ===================================================================== */
const DAY = {
  sun: new THREE.Color(0xfff3e2), sunI: 2.7, hemiI: 0.7, hemiSky: new THREE.Color(0x9fdcff),
  water: new THREE.Color(0x0b5566), lamp: new THREE.Color(1.0, 0.97, 0.9), led: new THREE.Color(1.6, 1.55, 1.45),
  glowI: 26, roomI: 160, caustic: 1.0, back: 1.0, emissive: 0.35,
};
const NIGHT = {
  sun: new THREE.Color(0x3d64ff), sunI: 0.55, hemiI: 0.12, hemiSky: new THREE.Color(0x2a4cff),
  water: new THREE.Color(0x03122c), lamp: new THREE.Color(0.25, 0.38, 1.0), led: new THREE.Color(0.12, 0.2, 0.9),
  glowI: 6, roomI: 18, caustic: 0.35, back: 0.12, emissive: 1.1,
};
const _c = new THREE.Color();
function applyNight(k) {
  sun.color.lerpColors(DAY.sun, NIGHT.sun, k); sun.intensity = lerp(DAY.sunI, NIGHT.sunI, k);
  hemi.intensity = lerp(DAY.hemiI, NIGHT.hemiI, k); hemi.color.lerpColors(DAY.hemiSky, NIGHT.hemiSky, k);
  U.uWaterColor.value.lerpColors(DAY.water, NIGHT.water, k);
  U.uLampColor.value.lerpColors(DAY.lamp, NIGHT.lamp, k);
  lampLedMat.color.lerpColors(DAY.led, NIGHT.led, k);
  tankGlow.intensity = lerp(DAY.glowI, NIGHT.glowI, k);
  tankGlow.color.copy(_c.set(0x6fcfff)).lerp(_c.clone().set(0x2440ff), k);
  roomKey.intensity = lerp(DAY.roomI, NIGHT.roomI, k);
  U.uCaustic.value = lerp(DAY.caustic, NIGHT.caustic, k);
  backdrop.material.uniforms.uBright.value = lerp(DAY.back, NIGHT.back, k);
  rayUniforms.uRay.value = lerp(1, 0.25, k);
  particleUniforms.uLight.value = lerp(1, 0.5, k);
  scene.background.lerpColors(BG_DAY, BG_NIGHT, k);
  SPECIES[0].bodyMat.emissiveIntensity = lerp(DAY.emissive, NIGHT.emissive, k);
  renderer.toneMappingExposure = lerp(1.05, 1.35, k);
}

/* =====================================================================
   Интерфейс и взаимодействие
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const ui = { feed: $('bFeed'), night: $('bNight'), air: $('bAir'), rot: $('bRot'), sound: $('bSound'), hide: $('bHide') };
function renderSpecies() {
  $('species').innerHTML = SPECIES.map((sp) => `
    <div class="sp"><i style="background:${sp.color};color:${sp.color}"></i><span class="nm" title="${sp.latin}">${sp.name}</span>
    <span class="ct">${sp.fish.length}</span><button data-add="${sp.id}" title="Запустить ещё одну">+</button></div>`).join('');
}
renderSpecies();
$('species').addEventListener('click', (e) => {
  const id = e.target?.dataset?.add; if (!id) return;
  const sp = SPECIES.find((s) => s.id === id);
  if (sp.fish.length >= sp.max) return;
  const x = rr(-4, 4), z = rr(-1, 1.5);
  const f = makeFish(sp, V3(x, WATER_Y - 0.25, z));
  f.vel.set(rr(-0.3, 0.3), -0.8, rr(-0.3, 0.3));
  addRipple(x, z, 1.2); sfx.plop();
  renderSpecies();
});
function toggleNight() { nightTarget = nightTarget ? 0 : 1; ui.night.innerHTML = (nightTarget ? '☀️ День' : '🌙 Ночь') + ' <kbd>N</kbd>'; }
function toggleAir() { airOn = !airOn; ui.air.classList.toggle('on', airOn); }
function toggleRot() { controls.autoRotate = !controls.autoRotate; ui.rot.classList.toggle('on', controls.autoRotate); }
function toggleSound() { const on = sfx.toggle(); ui.sound.innerHTML = (on ? '🔊' : '🔇') + ' Звук <kbd>M</kbd>'; ui.sound.classList.toggle('on', on); }
function toggleUI() { $('ui').classList.toggle('hidden'); $('hint').style.opacity = $('ui').classList.contains('hidden') ? 0 : 1; }
ui.feed.onclick = feedButton; ui.night.onclick = toggleNight; ui.air.onclick = toggleAir; ui.rot.onclick = toggleRot; ui.sound.onclick = toggleSound; ui.hide.onclick = toggleUI;
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.code;
  if (k === 'KeyF') feedButton(); else if (k === 'KeyN') toggleNight(); else if (k === 'KeyB') toggleAir();
  else if (k === 'KeyR') toggleRot(); else if (k === 'KeyM') toggleSound(); else if (k === 'KeyH') toggleUI();
  else if (k === 'Escape') stopFollow();
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const tankBox = new THREE.Box3(V3(-TANK.w / 2, 0, -TANK.d / 2), V3(TANK.w / 2, TANK.h, TANK.d / 2));
function pickFish(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(fishMeshes, false);
  if (!hits.length) return null;
  const h = hits[0];
  return h.object.userData.species.fish[h.instanceId] || null;
}
let following = null;
const followOffset = V3(0, 0, 0);
function startFollow(f) { following = f; const el = $('follow'); el.style.display = 'block'; el.innerHTML = `Следим: <b>${f.sp.name}</b> · <span style="opacity:.6">Esc — выйти</span>`; }
function stopFollow() { following = null; $('follow').style.display = 'none'; }

function ring(x, y) { const r = document.createElement('div'); r.className = 'ring'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 800); }
function handleClick(cx, cy) {
  const f = pickFish(cx, cy);
  if (f) { startFollow(f); return; }
  const ray = raycaster.ray;
  if (Math.abs(ray.direction.y) > 1e-4) {
    const t = (WATER_Y - ray.origin.y) / ray.direction.y;
    if (t > 0) {
      const p = ray.at(t, V3(0, 0, 0));
      if (p.x > IN.minX && p.x < IN.maxX && p.z > IN.minZ && p.z < IN.maxZ) { dropFood(p.x, p.z, 10, 0.35); ring(cx, cy); return; }
    }
  }
  const hit = ray.intersectBox(tankBox, V3(0, 0, 0));
  if (hit && hit.y < WATER_Y) {
    tapState.point.copy(hit); tapState.time = U.uTime.value;
    for (const fish of allFish) { const d = fish.pos.distanceTo(hit); if (d < 5.5) { fish.flee = lerp(1.6, 0.4, d / 5.5); fish.fleeFrom.copy(hit); } }
    sfx.tap(); ring(cx, cy);
    return;
  }
  if (following) stopFollow();
}
let down = null, lastHover = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 450) handleClick(e.clientX, e.clientY);
  down = null;
});
const tip = $('tip');
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || down) { tip.style.opacity = 0; return; }
  const now = performance.now(); if (now - lastHover < 70) return; lastHover = now;
  const f = pickFish(e.clientX, e.clientY);
  if (f) {
    tip.innerHTML = `<b>${f.sp.name}</b><em>${f.sp.latin}</em><span>${f.sp.info}</span>`;
    tip.style.left = Math.min(e.clientX + 16, innerWidth - 280) + 'px'; tip.style.top = (e.clientY + 16) + 'px'; tip.style.opacity = 1;
    renderer.domElement.style.cursor = 'pointer';
  } else { tip.style.opacity = 0; renderer.domElement.style.cursor = ''; }
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.opacity = 0; });

/* =====================================================================
   Камера
   ===================================================================== */
const camOuter = new THREE.Box3(V3(-TANK.w / 2 - 0.6, -1, -TANK.d / 2 - 0.6), V3(TANK.w / 2 + 0.6, TANK.h + 2.2, TANK.d / 2 + 0.6));
let intro = 1;
const introFrom = camera.position.clone();
controls.addEventListener('start', () => { intro = 0; });
function updateCamera(dt) {
  if (intro > 0) {
    intro = Math.max(0, intro - dt / 3.2);
    const k = 1 - Math.pow(1 - (1 - intro), 3);
    const to = controls.target.clone().addScaledVector(V3(0.12, 0.12, 1).normalize(), fitDistance());
    camera.position.lerpVectors(introFrom, to, k);
  }
  if (following) {
    _t.copy(following.pos).sub(controls.target).multiplyScalar(damp(2.5, dt));
    controls.target.add(_t); camera.position.add(_t);
  }
}
function constrainCamera() {
  const p = camera.position;
  if (camOuter.containsPoint(p)) {
    const opts = [
      [p.x - camOuter.min.x, () => (p.x = camOuter.min.x)], [camOuter.max.x - p.x, () => (p.x = camOuter.max.x)],
      [camOuter.max.y - p.y, () => (p.y = camOuter.max.y)], [p.z - camOuter.min.z, () => (p.z = camOuter.min.z)],
      [camOuter.max.z - p.z, () => (p.z = camOuter.max.z)],
    ];
    opts.sort((a, b) => a[0] - b[0])[0][1]();
  }
  if (p.y < -3.8) p.y = -3.8;
}

/* =====================================================================
   Цикл
   ===================================================================== */
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  particleUniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
let temp = 25.4, statT = 0;
// Адаптивное разрешение: на слабых GPU понижаем pixelRatio, на сильных возвращаем
const PR_MAX = Math.min(window.devicePixelRatio, 2);
let prCur = PR_MAX, perfAcc = 0, perfN = 0, perfLast = performance.now();
function adaptResolution() {
  const now = performance.now(), ms = now - perfLast; perfLast = now;
  if (ms > 500) return;
  perfAcc += ms; perfN++;
  if (perfAcc < 2000) return;
  const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
  let next = prCur;
  if (avg > 28 && prCur > 0.75) next = Math.max(0.75, prCur - 0.25);
  else if (avg < 14 && prCur < PR_MAX) next = Math.min(PR_MAX, prCur + 0.25);
  if (next !== prCur) { prCur = next; renderer.setPixelRatio(prCur); resize(); }
}
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  adaptResolution();
  U.uTime.value += dt;
  nightK = lerp(nightK, nightTarget, damp(1.2, dt));
  if (Math.abs(nightK - nightTarget) < 1e-3) nightK = nightTarget;
  applyNight(nightK);
  updateFood(dt);
  updateFish(dt);
  writeFishInstances();
  updateBubbles(dt);
  updateCamera(dt);
  controls.update(dt);
  constrainCamera();
  if ((statT -= dt) < 0) {
    statT = 2; temp = clamp(temp + rr(-0.05, 0.05) - nightK * 0.01, 24.6, 25.8);
    $('stats').textContent = `${temp.toFixed(1)} °C · pH 6.8 · ${allFish.length} рыб · ${nightTarget ? 'ночь' : 'день'}`;
  }
  renderer.render(scene, camera);
}
renderer.compile(scene, camera);
renderer.setAnimationLoop(frame);
requestAnimationFrame(() => requestAnimationFrame(() => $('loader').classList.add('done')));
setTimeout(() => { $('hint').style.opacity = 0.75; }, 12000);
window.__aquarium = { scene, camera, controls, renderer, SPECIES, toggleNight, feedButton, U, DAY, NIGHT, food,
  skipIntro: () => { intro = 0; }, setNight: (k) => { nightK = nightTarget = k; } };
</script>
<script>
  // Сообщение, если модуль не загрузился (нет сети / WebGL)
  setTimeout(() => {
    const l = document.getElementById('loader');
    if (l && !l.classList.contains('done')) document.getElementById('loadtxt').innerHTML =
      '<div id="err">Не удалось запустить сцену. Нужен браузер с WebGL2 и доступ к cdn.jsdelivr.net для загрузки three.js.</div>';
  }, 15000);
</script>
