const P = (x, w, yT, yB, hT, cT, hB, cB) => ({ x, w, yT, yB, hT, cT, hB, cB });
const MAIN = [P(-49.2, 5.2, 3.8, -4.4, 1.6, 1.8, 1.4, 1.6), P(-46.5, 7.0, 5.4, -5.8, 2.0, 2.2, 1.8, 2.1),

const FRONT = [P(26, 8.5, 2.0, -6.6, 0, 0, 2.0, 2.4), P(34, 8.3, 2.0, -6.4, 0, 0, 2.0, 2.4), P(40, 7.4, 2.0, -5.9, 0, 0, 2.0, 2.4),
  P(45, 5.8, 2.0, -5.0, 0, 0, 1.8, 2.2), P(49.2, 4.0, 1.2, -3.6, 0, 0, 1.4, 1.8)];
const CAN = (x, w, yT, hT, cT, base) => ({ x, w, yT, hT, cT, base });
const CANOPY = [CAN(26, 8.5, 6.4, 2.0, 2.3, 2.0), CAN(31, 8.4, 6.3, 2.0, 2.4, 2.0), CAN(36, 7.9, 5.8, 1.9, 2.5, 2.0),

function interp(list, x) {

const HULL_GLSL = /* glsl */`

  for (let s = 0; s < rings.length - 1; s++) {

    for (let k = 0; k < segs; k++) {

  if (n.dot(wantN) < 0) for (let i = 0; i < pts.length; i += 3) [pts[i + 1], pts[i + 2]] = [pts[i + 2], pts[i + 1]];
  return trisGeo(pts);
}

function updateWalk(dt) {
  const k = walk.keys;

  const st = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);

    const dz = (-Math.cos(walk.yaw) * fw - Math.sin(walk.yaw) * st) / len * sp;
    if (free(walk.deck, walk.x + dx, walk.z)) { walk.x += dx; moving = true; }
    if (free(walk.deck, walk.x, walk.z + dz)) { walk.z += dz; moving = true; }
  }
  walk.bob += moving ? dt * (sp / dt) * 2.6 : 0;
  const D = DECKS[walk.deck];
  camera.position.set(walk.x, D.floor + 1.65 + (moving ? Math.sin(walk.bob) * 0.03 : 0), walk.z);
  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
  // текущий отсек
  const r = ROOMS.find((o) => o.d === walk.deck && walk.x >= Math.min(o.x0, o.x1) && walk.x <= o.x1 && walk.z >= o.z0 - 0.05 && walk.z <= o.z1 + 0.05 && (o.type !== 'bridge' || walk.x > 25.5));

    document.getElementById('wRoom').textContent = r ? r.name : 'Коридор';
    document.getElementById('lift').style.display = r && r.type === 'lift' ? 'block' : 'none';

  let changed = false;
  for (const d of DOORS) {
    const near = d.deck === walk.deck && Math.hypot(d.x - walk.x, d.z - walk.z) < 2.4;
    const o = clamp(d.open + (near ? dt * 2.5 : -dt * 1.8), 0, 1);
    if (o !== d.open) { d.open = o; changed = true; }
  }
  if (changed) updateDoors();
}

}

  T += dt;
  adaptResolution();
  plumeMat.uniforms.uTime.value = T; planetMat.uniforms.uTime.value = T;
  // двигатели
  const thr = state.engines ? 1 : 0;
  plumeMat.uniforms.uThrottle.value = lerp(plumeMat.uniforms.uThrottle.value, thr, damp(3, dt));
  const k = plumeMat.uniforms.uThrottle.value;
  for (const e of engines) {
    e.disc.material.color.setRGB(lerp(0.05, 0.35, k), lerp(0.08, 0.9, k), lerp(0.12, 2.6, k));
    e.core.material.color.setRGB(lerp(0.1, 1.6, k), lerp(0.15, 2.6, k), lerp(0.2, 5.0, k));
    e.plume.visible = k > 0.02;
  }
  for (const n of navMat) {
    const on = state.nav && (!n.blink || ((T * n.blink + n.phase) % 1) < 0.12);
    n.mat.color.copy(n.color).multiplyScalar(on ? 1 : 0.03);
  }
  // пульсация реактора
  const rx = ROOMS.find((r) => r.type === 'reactor');
  if (rx?.pulse) {
    const p = 0.75 + 0.25 * Math.sin(T * 3.1) + 0.06 * Math.sin(T * 13);
    for (const i of rx.pulse) { const L = LIGHTS[i]; lData[(MAXL + L.slot) * 4 + 3] = L.I * p; }
    lTex.needsUpdate = true;
  }
  for (const a of animated) a(T);
  // взрыв-схема
  state.explodeT = lerp(state.explodeT, state.explode, damp(2.2, dt));
  const ex = ease(clamp(state.explodeT, 0, 1));
  for (const g of Object.values(MOD)) g.position.copy(g.userData.off).multiplyScalar(ex);
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / tween.dur);
    const s = ease(tween.t);
    camera.position.lerpVectors(tween.p0, tween.p1, s); controls.target.lerpVectors(tween.t0, tween.t1, s);
    if (tween.t >= 1) tween = null;
  }
  if (state.mode === 'walk') updateWalk(dt);
  else controls.update(dt);
  updateLabels();
  composer.render(dt);
}
setMode('ext', { keep: true });
{ const [p, t] = VIEWS.hero(); camera.position.copy(p).multiplyScalar(1.5); controls.target.copy(t); flyTo(p, t, 2.6); }
renderer.compile(scene, camera);
renderer.setAnimationLoop(frame);
requestAnimationFrame(() => requestAnimationFrame(() => document.getElementById('loader').classList.add('done')));
window.__vesper = { scene, camera, controls, renderer, ROOMS, DECKS, LIGHTS, WALK, BLOCK, DOORS, walk, state, setMode, setView, setPalette, free, spawnFor,
  skipTween: () => { if (tween) { camera.position.copy(tween.p1); controls.target.copy(tween.t1); tween = null; } } };
</script>

  setTimeout(() => {
    const l = document.getElementById('loader');
    if (l && !l.classList.contains('done')) document.getElementById('loadtxt').innerHTML =
      '<div style="color:#ff9a8a;max-width:520px;text-align:center;letter-spacing:0">Не удалось запустить сцену. Нужен браузер с WebGL2 и доступ к cdn.jsdelivr.net для загрузки three.js.</div>';
  }, 20000);
</script>
